[project]
name = "nthp_api"
version = "0.3.0"
description = "This is a CLI tool for building the Nottingham New Theatre's History Project content database."
authors = [{ name = "Will Pimblett", email = "will@wjdp.uk" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4,<3",
    "python-frontmatter>=1.3.0,<2",
    "peewee>=4.3.0,<5",
    "python-slugify>=8.0.4,<9",
    "pyhumps>=3.8.0,<4",
    "click>=8.4.2,<9",
    "coloredlogs>=15.0.1,<16",
    "pydantic-collections>=0.6.0,<0.7",
    "markdown>=3.10.3,<4",
    "pyyaml>=6.0.3,<7",
    "httpx>=0.28.1,<0.29",
    "pydantic-settings>=2.15.0,<3",
    "nh3>=0.3.6",
    "rich>=15.0.0",
]

[project.urls]
homepage = "https://github.com/newtheatre/nthp-api"
repository = "https://github.com/newtheatre/nthp-api"

[project.scripts]
nthp = "nthp_api.cli:cli"
nthp_api = "nthp_api.cli:cli"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-vcr>=1.0.2,<2",
    "mypy>=2.3.1,<3",
    "types-python-slugify>=8.0.2.20240310,<9",
    "types-markdown>=3.10.2.20260712,<4",
    "freezegun>=1.5.5,<2",
    "types-pyyaml>=6.0.12.20260815,<7",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.16.3,<0.17",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "nthp_api"
[tool.mypy]
python_version = "3.13"
files = "nthp_api"
pretty = true
ignore_missing_imports = true
plugins = [ "pydantic.mypy" ]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
# Matches the formatter
line-length = 88

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "C90", # mccabe, complexity
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    # "DTZ", # flake8-datetimez
    "ICN", # flake8-import-conventions
    "ISC", # flake8-implicit-str-concat
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SIM", # flake8-simplify
    "TC", # flake8-type-checking (was TCH)
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL", # pylint
    "TRY", # tryceratops
    "RUF", # ruff special rules
]
ignore = [
    "TRY003", # Permit long exception messages
    "ISC001", # Conflicts with the formatter
    "PLC0415", # Permit deferred imports, used in the CLI to speed up startup
]

[tool.ruff.lint.per-file-ignores]
"bin/*" = ["INP001"]
"dev/*" = ["INP001"]
"*/fixtures/*" = ["E501"]
