[project]
name = "nthp_api"
version = "0.1.9"
description = "This is a CLI tool for building the Nottingham New Theatre's History Project content database."
authors = [{ name = "Will Pimblett", email = "will@wjdp.uk" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.1.1,<3",
    "python-frontmatter>=1.0.0,<2",
    "peewee>=3.16.2,<4",
    "python-slugify>=8.0.1,<9",
    "pyhumps>=3.8.0,<4",
    "click>=8.1.3,<9",
    "coloredlogs>=15.0.1,<16",
    "pydantic-collections>=0.5.0,<0.6",
    "Markdown>=3.4.3,<4",
    "PyYAML>=6.0,<7",
    "httpx>=0.24.1,<0.25",
    "pydantic-settings>=2.0.2,<3",
]

[project.urls]
homepage = "https://github.com/newtheatre/nthp-api"
repository = "https://github.com/newtheatre/nthp-api"

[project.scripts]
nthp = "nthp_api.cli:cli"
nthp_api = "nthp_api.cli:cli"

[dependency-groups]
dev = [
    "pytest>=7.3.1,<8",
    "pytest-vcr>=1.0.2,<2",
    "mypy>=1.3.0,<2",
    "pytest-depends>=1.0.1,<2",
    "types-python-slugify>=8,<9",
    "types-Markdown>=3.3.7,<4",
    "freezegun>=1.2.2,<2",
    "types-PyYAML>=6.0.1,<7",
    "pytest-asyncio>=0.21.0,<0.22",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "nthp_api"
[tool.mypy]
python_version = "3.11"
files = "nthp_api"
pretty = true
ignore_missing_imports = true
plugins = [ "pydantic.mypy" ]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.ruff]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "C90", # mccabe, complexity
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    # "DTZ", # flake8-datetimez
    "ICN", # flake8-import-conventions
    "ISC", # flake8-implicit-str-concat
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL", # pylint
    "TRY", # tryceratops
    "RUF", # ruff special rules
]
ignore = [
    "TRY003", # Permit long exception messages
]

# Higher than black to give wiggle room
line-length = 120

[tool.ruff.per-file-ignores]
"bin/*" = ["INP001"]
"dev/*" = ["INP001"]
"*/fixtures/*" = ["E501"]
