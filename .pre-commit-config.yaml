repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3 # https://github.com/astral-sh/ruff-pre-commit/tags
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  # pre-commit/mirrors-prettier is archived, this is the maintained fork
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6 # https://github.com/rbubley/mirrors-prettier/tags
    hooks:
      - id: prettier
